<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BTG &amp; Taps</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<meta name="apple-mobile-web-app-title" content="BTG &amp; Taps">
<meta name="theme-color" content="#1F9A96">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b2023; --brown:#17807E; --teal:#1F9A96; --cream:#eef0ee; --line:#d9dedc; --muted:#5a6469; --gold:#f1f1ec; --red:#b42318; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--cream); }
  header { position:sticky; top:0; z-index:5; background:var(--teal); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 0; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .brand img { width:44px; height:44px; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  header h1 { margin:0; font:600 19px Lora, Georgia, serif; letter-spacing:.3px; }
  header h1 small { display:block; font:400 12px "IBM Plex Sans", Arial, sans-serif; letter-spacing:1.5px; text-transform:uppercase; opacity:.85; }
  .weekbar { display:flex; gap:8px; margin-bottom:10px; }
  select, input, textarea { font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; background:#fff; }
  .weekbar select { flex:1; }
  nav { display:flex; }
  nav button { flex:1; background:none; border:0; color:#d6f0ee; font:600 15px inherit; padding:10px 0 12px; border-bottom:3px solid transparent; font-family:inherit; }
  nav button.on { color:#fff; border-color:var(--gold); }
  main { padding:12px 16px 120px; max-width:640px; margin:0 auto; }
  .sec { margin:18px 0 6px; display:flex; align-items:baseline; justify-content:space-between; }
  .sec h2 { margin:0; font:700 19px Lora, Georgia, serif; }
  .item { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:6px 0; font-family:Georgia, serif; font-size:15px; }
  .item .sub { font-size:13px; font-style:italic; color:#4a403a; }
  .item .staff { font-family:-apple-system, Arial, sans-serif; font-size:12px; color:var(--muted); margin-top:4px; }
  .add { background:none; border:1px dashed var(--muted); color:var(--muted); border-radius:12px; padding:9px; width:100%; font:inherit; margin:4px 0 0; }
  .btn { border:0; border-radius:10px; padding:11px 16px; font:600 15px inherit; font-family:inherit; background:var(--brown); color:#fff; }
  .btn.ghost { background:#fff; color:var(--brown); border:1px solid var(--line); }
  .btn.danger { background:#fff; color:var(--red); border:1px solid #e8c9c3; }
  .btn.small { padding:7px 12px; font-size:13px; font-family:-apple-system, Arial, sans-serif; }
  .tap { display:flex; gap:12px; align-items:flex-start; }
  .tapno { flex:0 0 38px; height:38px; border-radius:50%; background:var(--brown); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:Arial; }
  .tap .body { flex:1; }
  .next { font-family:-apple-system, Arial, sans-serif; font-size:13px; margin-top:4px; }
  .next b { color:var(--brown); }
  .none { color:var(--red); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  .card h3 { margin:0 0 6px; font:700 17px Lora, Georgia, serif; }
  .muted { color:var(--muted); font-size:14px; }
  a.link { display:block; padding:12px; margin-top:8px; border-radius:10px; background:var(--cream); color:var(--brown); font-weight:600; text-decoration:none; text-align:center; }
  /* editor sheet */
  .shade { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:#fff; border-radius:16px 16px 0 0; max-height:92vh; overflow:auto; padding:16px 16px 28px; display:none; }
  .sheet h3 { margin:0 0 4px; font:700 18px Lora, Georgia, serif; }
  .field { margin:10px 0; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .field.staff input { background:#F0F0F0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 10px; }
  .preview { background:var(--cream); border-radius:10px; padding:10px; font-family:Georgia, serif; text-align:center; margin:8px 0; font-size:14px; }
  .outbox { background:#FBE9E7; border:1px solid #F1C7C0; border-radius:12px; padding:10px 12px; margin:10px 0; }
  .inbox { background:#E3F3F1; border:1px solid #BFE3DF; border-radius:12px; padding:10px 12px 4px; margin:10px 0; }
  .tag { display:inline-block; font:700 11px "IBM Plex Sans", Arial, sans-serif; letter-spacing:1px; padding:2px 7px; border-radius:6px; color:#fff; margin-bottom:6px; }
  .tag.out { background:var(--red); } .tag.in { background:var(--brown); } .tag.next { background:#8a5300; }
  .outbox .keg { font-family:Lora, Georgia, serif; text-decoration:line-through; color:#7a2a1f; }
  .lbl { font:700 10.5px "IBM Plex Sans", Arial, sans-serif; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  .pill { display:inline-block; font:700 11px "IBM Plex Sans", Arial, sans-serif; letter-spacing:.5px; padding:2px 8px; border-radius:999px; margin-left:4px; vertical-align:1px; }
  .pill.IN { background:#DDF1E6; color:#1d6b43; } .pill.OUT { background:#FBE0DC; color:#a3271a; }
  .pill.Coming { background:#FCEFD6; color:#8a5300; } .pill.ON { background:#DCEBF7; color:#1f5a8a; }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chip { border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; text-align:left; font:inherit; font-size:13px; color:var(--ink); }
  .chip b { display:block; font-size:14px; }
  .chip.sel { border-color:var(--brown); background:#E3F3F1; }
  .legend { font-size:12.5px; color:var(--muted); margin:-4px 0 10px; }
  .legend .pill { margin:0 2px 0 0; }
  .item .acts { display:flex; justify-content:flex-end; margin-top:6px; }
  .swaps { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:8px 0 14px; }
  .swaps h4 { margin:2px 0 6px; font:600 13px "IBM Plex Sans", Arial, sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .swap { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .swap:first-of-type { border-top:0; }
  .swap .t { flex:1; }
  #toast button { background:none; border:1px solid rgba(255,255,255,.6); color:#fff; border-radius:8px; padding:5px 10px; margin-left:10px; font:600 13px inherit; }
  .preview:empty { display:none; }
  .note { background:#FFF6DA; border-radius:10px; padding:10px; font-size:14px; margin:8px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .row .btn { flex:1; }
  .stafflabel { margin:16px 0 0; font-size:12px; font-weight:700; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:30; background:var(--ink); color:#fff; padding:12px 14px; border-radius:12px; display:none; font-size:14px; align-items:center; justify-content:space-between; }
  #busy { position:fixed; inset:0; z-index:40; background:rgba(247,242,234,.92); display:none; flex-direction:column; align-items:center; justify-content:center; font-weight:600; color:var(--brown); text-align:center; padding:0 24px; }
  /* loading graphic: a bottle pours red wine into the black Fool's Errand logo */
.pour{width:132px;height:156px;display:block;margin:0 auto 10px}
.pour .tilt{transform:rotate(-80deg);animation:fe-tilt 3.4s ease-in-out infinite}
.pour .stream{transform-origin:104px 52px;transform:scaleY(0);animation:fe-stream 3.4s linear infinite}
.pour .wine{transform:translateY(206px);animation:fe-fill 3.4s cubic-bezier(.45,.05,.55,.95) infinite}
.pour .wave{animation:fe-wave 1.1s linear infinite}
.pour .wave2{animation:fe-wave 1.7s linear infinite reverse}
@keyframes fe-tilt{0%{transform:rotate(-80deg)}14%,78%{transform:rotate(-132deg)}90%,100%{transform:rotate(-80deg)}}
@keyframes fe-stream{0%,13%{transform:scaleY(0)}20%,76%{transform:scaleY(1);opacity:1}82%,100%{transform:scaleY(1);opacity:0}}
@keyframes fe-fill{0%,16%{transform:translateY(206px);opacity:1}80%{transform:translateY(74px);opacity:1}92%{transform:translateY(74px);opacity:1}100%{transform:translateY(74px);opacity:0}}
@keyframes fe-wave{from{transform:translateX(0)}to{transform:translateX(-100px)}}
@media (prefers-reduced-motion:reduce){.pour .tilt{animation:none;transform:rotate(-132deg)}.pour .stream{animation:none;transform:none}.pour .wine{animation:none;transform:translateY(130px)}.pour .wave,.pour .wave2{animation:none}}

</style>
</head>

<script>
var FIELDS = {
  beer: [[0,'Brewery'],[1,'Beer name'],[2,'Style (prints bold)'],[3,'Description (italic, **word** = bold)'],[4,'ABV'],[5,'Size'],[6,'Price'],[7,'Note (prints *note)']],
  wine: [[0,'Producer'],[1,'Wine name'],[2,'Grape (prints bold)'],[5,'After grape (plain, e.g. Kabinett)'],[3,'Place'],[4,'Vintage'],[6,'Price'],[7,'Note (prints *note)']],
  hh:   [[0,'Item'],[6,'Price'],[7,'Note (prints *note)']]
};
var STAFF = {
  beer: [[8,'Tap #'],[9,'NEXT UP – backup'],[10,'Where the backup is']],
  wine: [[9,'NEXT UP – backup bottle'],[10,'Where the backup is']],
  hh: []
};
var S = {weeks:[], week:null, data:null, tab:'menu', edit:null};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function q(s){ return '‘'+s+'’'; }
function price(p){ return String(p||'').replace(/^\$/,''); }
function rich(desc){ // **word** -> bold
  return esc(desc).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function lineHtml(kind, v){
  if (kind==='beer'){
    var tail=[v[4],v[5],price(v[6])].filter(Boolean).join(' | ');
    var h=esc(v[0])+(v[1]?' '+esc(q(v[1])):'')+' <b>'+esc(v[2])+'</b> '+(tail?'| '+esc(tail):'')+(v[7]?' *<b><i>'+esc(v[7])+'</i></b>':'');
    if (v[3]) h+='<div class="sub">'+rich(v[3])+'</div>';
    return h;
  }
  if (kind==='wine'){
    return esc(v[0])+(v[1]?' '+esc(q(v[1])):'')+' <b>'+esc(v[2])+'</b>'+(v[5]?' '+esc(v[5]):'')+
      '<div>'+esc(v[3])+(v[4]?' '+esc(v[4]):'')+' | '+esc(price(v[6]))+(v[7]?' *<b><i>'+esc(v[7])+'</i></b>':'')+'</div>';
  }
  return v[6] ? '<b>$'+esc(price(v[6]))+' '+esc(v[0])+(v[7]?' *'+esc(v[7]):'')+'</b>' : '<b>'+esc(v[0])+'</b>';
}

function toast(msg,label,fn,ms){
  var t=document.getElementById('toast'); t.innerHTML='<span>'+esc(msg)+'</span>'; t.style.display='flex';
  if(label){ var b=document.createElement('button'); b.textContent=label; b.onclick=function(){ t.style.display='none'; fn(); }; t.appendChild(b); }
  clearTimeout(toast.h); toast.h=setTimeout(function(){t.style.display='none';},ms||3500);
}
function busy(on,txt){ document.getElementById('busytext').textContent=txt||'Saving…'; document.getElementById('busy').style.display=on?'flex':'none'; }
function getPin(){ try{ return localStorage.getItem('fe_pin')||''; }catch(e){ return S.pin||''; } }
function setPin(p){ S.pin=p; try{ localStorage.setItem('fe_pin',p); }catch(e){} }
function call(fn,args,ok,txt,tries){
  if(!getPin()){ askPin(function(){ call(fn,args,ok,txt); }); return; }
  busy(true,txt);
  /* Never hang: give up after a while (longer for Make Menu) so the phone
     doesn't sit on a spinner forever, e.g. after the app was in the background. */
  var ctl=window.AbortController?new AbortController():null, done=false;
  var READS={listWeeks:1,getWeek:1,recentChanges:1,recentSwaps:1};
  var limit=fn==='makeMenuFor'?180000:(READS[fn]?60000:150000);
  var slow=setTimeout(function(){ if(!done && fn!=='makeMenuFor') document.getElementById('busytext').textContent='Still working… Google is slow right now. Keep the app open.'; },12000);
  var timer=setTimeout(function(){ if(!done){ done=true; clearTimeout(slow); if(ctl) ctl.abort(); fail('Google took too long to answer.'); } },limit);
  function fail(msg){
    busy(false);
    // reading is always safe to repeat: try once more on its own before saying anything
    if(READS[fn] && !tries) return call(fn,args,ok,txt,1);
    if(!S.data && (fn==='listWeeks'||fn==='getWeek')) return showRetry(msg);
    if(!READS[fn] && fn!=='makeMenuFor'){   // a change may have gone through anyway: show what the sheet has now
      closeSheet(); toast('Not sure that went through. Showing what\'s in the sheet now; check it before trying again.',null,null,8000);
      return refreshWeek();
    }
    toast(msg+' Try again.','Retry',function(){ call(fn,args,ok,txt); },8000);
  }
  fetch(window.FE_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({pin:getPin(),fn:fn,args:args}),signal:ctl?ctl.signal:undefined})
  .then(function(r){ return r.json(); })
  .then(function(res){
    if(done) return; done=true; clearTimeout(timer); clearTimeout(slow);
    busy(false);
    if(res.ok){ ok(res.result); return; }
    if(res.badPin){ setPin(''); askPin(function(){ call(fn,args,ok,txt); },'That PIN didn\'t work. Try again.'); return; }
    if(!S.data && (fn==='listWeeks'||fn==='getWeek')) return showRetry(res.error||'Something went wrong.');
    if(/changed in the sheet/.test(res.error||'')){   // the app was showing an old copy: load the latest
      closeSheet(); toast('That item was already changed. Here\'s what\'s in the sheet now.',null,null,6000);
      return refreshWeek();
    }
    toast(res.error||'Something went wrong.');
  })
  .catch(function(){ if(done) return; done=true; clearTimeout(timer); clearTimeout(slow); fail('Can\'t reach the sheet. Check the connection.'); });
}
function refreshWeek(){
  if(!S.week) return;
  call('getWeek',[S.week],function(d){ S.data=d; render(); loadSwaps(); },'Loading the latest…');
}
function showRetry(msg){
  document.getElementById('main').innerHTML='<div class="card" style="text-align:center;padding:22px 16px">'+
    '<p style="margin:0 0 6px"><b>The app couldn\'t load the menu.</b></p>'+
    '<p class="muted" style="margin:0 0 14px">'+esc(msg)+'</p>'+
    '<button class="btn" onclick="location.reload()">Try again</button></div>';
}
function askPin(then,msg){
  var s=document.getElementById('sheet');
  s.innerHTML='<h3>Enter the staff PIN</h3><p class="muted">'+(msg?esc(msg):'You only need to do this once on this phone.')+'</p>'+
    '<div class="field"><input id="pinbox" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="PIN"></div>'+
    '<div class="row"><button class="btn" id="pinok">Unlock</button></div>';
  s.style.display='block'; document.getElementById('shade').style.display='block';
  var go=function(){ var v=document.getElementById('pinbox').value.trim(); if(!v) return; setPin(v); s.style.display='none'; document.getElementById('shade').style.display='none'; then(); };
  document.getElementById('pinok').onclick=go;
  document.getElementById('pinbox').onkeydown=function(e){ if(e.key==='Enter') go(); };
  setTimeout(function(){ document.getElementById('pinbox').focus(); },50);
}
function init(){
  call('listWeeks',[],function(w){
    S.weeks=w.weeks; fillWeeks(w.current); loadWeek(w.current);
  },'Loading…');
}
function fillWeeks(sel){
  document.getElementById('week').innerHTML=S.weeks.map(function(n){return '<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';}).join('');
}
function loadWeek(name){
  S.week=name;
  call('getWeek',[name],function(d){ S.data=d; render(); },'Loading…');
}
var STATUS=[['IN','In the backup fridge'],['OUT','Not in the backup fridge'],['Coming','Ordered / delivery'],['ON','Already on tap']];
function pill(st){ st=String(st||'').trim(); if(!st) return ''; var k=st.toUpperCase()==='COMING'?'Coming':st.toUpperCase(); return '<span class="pill '+esc(k)+'">'+esc(k==='Coming'?'Coming':k)+'</span>'; }
function legend(){ return '<div class="legend">Backup: '+STATUS.map(function(x){return pill(x[0])+esc(x[1].toLowerCase());}).join(' · ')+'</div>'; }
function nextLine(v,noun){
  return '<div class="next"><span class="lbl">Next up</span> '+(v[9]?'<b>'+esc(v[9])+'</b>'+pill(v[10]):'<span class="none">no backup listed</span>')+'</div>';
}
function noun(sec){ return sec.key==='DRAFT'?'keg':(sec.kind==='wine'?'bottle':'item'); }
function tab(t){
  S.tab=t; ['menu','taps','print'].forEach(function(x){document.getElementById('t-'+x).className= x===t?'on':'';});
  render(); if(t!=='print') loadSwaps();
}
function render(){
  var m=document.getElementById('main');
  if(!S.data){ m.innerHTML='<p class="muted">Loading…</p>'; return; }
  if(S.tab==='menu') m.innerHTML=renderMenu();
  if(S.tab==='taps') m.innerHTML=renderTaps();
  if(S.tab==='print') m.innerHTML=renderPrint();
}
function swapsHtml(filter,title){
  var list=(S.swaps||[]).filter(filter);
  if(!list.length) return '<div class="swaps"><h4>'+esc(title)+'</h4><div class="muted" style="font-size:13.5px;padding:2px 0 4px">No changes yet this week. Anything you change in the app shows up here with an <b>Undo</b> button.</div></div>';
  return '<div class="swaps"><h4>'+esc(title)+'</h4>'+list.map(function(w){
    var body;
    if(w.change==='Swapped') body='<span style="color:var(--red)">Came off:</span> '+esc(w.before)+'<br><span style="color:var(--brown)">Went on:</span> '+esc(w.after);
    else if(w.change==='Added') body='<span style="color:var(--brown)">Added:</span> '+esc(w.after);
    else if(w.change==='Deleted') body='<span style="color:var(--red)">Deleted:</span> '+esc(w.before);
    else body='<span style="color:var(--red)">Was:</span> '+esc(w.before)+'<br><span style="color:var(--brown)">Now:</span> '+esc(w.after);
    return '<div class="swap"><div class="t"><b>'+esc(w.where)+'</b> · '+esc(w.change.toLowerCase())+' · '+esc(w.when)+'<br>'+body+
      '</div><button class="btn small ghost" onclick="undoKeg('+w.logRow+')">Undo</button></div>';
  }).join('')+'</div>';
}
function renderMenu(){
  var h='<p class="muted">Tap any item to change it. You\'ll be asked to confirm, and every change can be undone under <b>Recent changes</b>.</p>'+
    legend()+swapsHtml(function(){ return true; },'Recent changes');
  return h+S.data.sections.map(function(sec,si){
    var h='<div class="sec"><h2>'+esc(sec.key==='HH'?'Happy Hour':sec.label)+'</h2></div>';
    sec.items.forEach(function(it,ii){
      var staff='';
      if(sec.kind!=='hh' && (it.v[8]||it.v[9]||it.v[10])) staff='<div class="staff">'+(it.v[8]?'Tap '+esc(it.v[8])+' · ':'')+'Next up: '+(it.v[9]?esc(it.v[9]):'none')+pill(it.v[10])+'</div>';
      h+='<div class="item" onclick="openEdit('+si+','+ii+')">'+lineHtml(sec.kind,it.v)+staff+'</div>';
    });
    h+='<button class="add" onclick="openAdd('+si+')">+ Add to '+esc(sec.key==='HH'?'Happy Hour':sec.label)+'</button>';
    return h;
  }).join('');
}
function renderTaps(){
  var draft=S.data.sections.filter(function(s){return s.key==='DRAFT';})[0];
  if(!draft) return '<p class="muted">No DRAFT section on this tab.</p>';
  var si=S.data.sections.indexOf(draft);
  var items=draft.items.map(function(it,ii){return {it:it,ii:ii};})
    .sort(function(a,b){return (parseFloat(a.it.v[8])||99)-(parseFloat(b.it.v[8])||99);});
  var h='<p class="muted">Keg kicked? Tap <b>Swap keg</b> on that tap to put the next keg on. The menu updates. Made a mistake? Hit <b>Undo</b> under Recent tap changes.</p>'+
    legend()+swapsHtml(function(w){ return w.where.indexOf('Tap ')===0; },'Recent tap changes');
  return h+items.map(function(x){
      var v=x.it.v;
      return '<div class="item"><div class="tap"><div class="tapno">'+esc(v[8]||'?')+'</div><div class="body" onclick="openEdit('+si+','+x.ii+')">'+
        '<div class="lbl">On tap now</div>'+esc(v[0])+(v[1]?' '+esc(q(v[1])):'')+' <b>'+esc(v[2])+'</b>'+nextLine(v)+'</div>'+
        '<button class="btn small ghost" onclick="openSwap('+si+','+x.ii+')">Swap keg</button></div></div>';
    }).join('');
}
function loadSwaps(){
  call('recentChanges',[S.week],function(r){ S.swaps=r; if(S.tab!=='print') render(); },'Loading…');
}
function renderPrint(){
  return '<div class="card"><h3>Make this week\'s menu</h3><p class="muted">Builds the printable menu from <b>'+esc(S.week)+
    '</b> right here on the phone in a few seconds. Nothing is saved anywhere, so make it again any time something changes.</p>'+
    '<button class="btn" style="width:100%" onclick="makeMenu()">Make Menu</button><div id="menuLinks"></div></div>'+
    '<div class="card"><h3>Printing</h3><p class="muted">Tap <b>Print or share</b>, then <b>Print</b>. Landscape, actual size (100%), 8.5 × 11. '+
    'Print, flip the sheet printed side up, print the same page again, then cut in half.</p></div>';
}
function loadMenuJs(then){
  if(window.buildMenuPdf) return then();
  var s=document.createElement('script'); s.src='menu.js?b='+APP_BUILD;
  s.onload=then; s.onerror=function(){ busy(false); toast('Couldn\'t load the menu maker. Check the connection and try again.'); };
  document.head.appendChild(s);
}
function makeMenu(){
  // get the latest from the sheet first, then draw the menu on the phone
  call('getWeek',[S.week],function(d){
    S.data=d;
    busy(true,'Making the menu…');
    loadMenuJs(function(){
      setTimeout(function(){
        try{
          window.buildMenuPdf(d,function(blob,info){
            busy(false);
            var name='BTG Menu - '+S.week+'.pdf';
            if(S.pdfUrl) URL.revokeObjectURL(S.pdfUrl);
            S.pdfUrl=URL.createObjectURL(blob);
            S.pdfFile=new File([blob],name,{type:'application/pdf'});
            var h='';
            if(info.tooLong) h+='<div class="note">This week is too long to fit well. Shorten a description or remove an item, then make it again.</div>';
            h+='<div class="note" style="margin-top:12px">Menu ready: <b>'+esc(name)+'</b></div>'+
               '<button class="btn" style="width:100%" onclick="sharePdf()">Print or share</button>'+
               '<a class="link" href="'+S.pdfUrl+'" target="_blank">Open the PDF to check it</a>';
            document.getElementById('menuLinks').innerHTML=h;
          });
        }catch(err){ busy(false); toast('Couldn\'t make the menu: '+(err&&err.message||err)); }
      },30);
    });
  },'Getting the latest menu…');
}
function sharePdf(){
  var f=S.pdfFile;
  if(f && navigator.canShare && navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:f.name}).catch(function(){});
  } else if(S.pdfUrl){ window.open(S.pdfUrl,'_blank'); }
}

/* ---------- editor ---------- */
function fieldHtml(i,label,val,staff){
  if(i===10){
    var cur=String(val||'').trim().toUpperCase();
    return '<div class="field staff"><label>'+esc(label)+'</label><input type="hidden" id="f10" value="'+esc(val)+'"><div class="chips">'+
      STATUS.map(function(x){ var on=cur===x[0].toUpperCase(); return '<button type="button" class="chip'+(on?' sel':'')+'" onclick="pickStatus(this,\''+x[0]+'\')"><b>'+esc(x[0])+'</b>'+esc(x[1])+'</button>'; }).join('')+'</div></div>';
  }
  var big = i===3 && S.edit.kind==='beer';
  return '<div class="field'+(staff?' staff':'')+'"><label>'+esc(label)+'</label>'+
    (big?'<textarea id="f'+i+'" rows="2" oninput="prev()">'+esc(val)+'</textarea>':'<input id="f'+i+'" value="'+esc(val)+'" oninput="prev()">')+'</div>';
}
function sheetHtml(title,note){
  var e=S.edit, v=e.v, f=FIELDS[e.kind], st=STAFF[e.kind];
  var h='<h3>'+esc(title)+'</h3>'+(note?'<div class="note">'+note+'</div>':'')+'<div class="preview" id="pv"></div>';
  h+=f.map(function(x){return fieldHtml(x[0],x[1],v[x[0]]||'');}).join('');
  if(st.length){ h+='<div class="stafflabel">Staff only – never prints</div>'+st.map(function(x){return fieldHtml(x[0],x[1],v[x[0]]||'',true);}).join(''); }
  h+='<div class="row"><button class="btn" onclick="save()">Save</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>';
  if(e.row){
    h+='<div class="row"><button class="btn small ghost" onclick="move(-1)">↑ Move up</button><button class="btn small ghost" onclick="move(1)">↓ Move down</button>'+
       '<button class="btn small danger" onclick="del()">Delete</button></div>';
  }
  return h;
}
function pickStatus(btn,val){
  var box=document.getElementById('f10'), was=box.value.toUpperCase()===val.toUpperCase();
  box.value=was?'':val;
  Array.prototype.forEach.call(btn.parentNode.children,function(c){c.classList.remove('sel');});
  if(!was) btn.classList.add('sel');
}
function showSheet(html){
  var s=document.getElementById('sheet'); s.innerHTML=html; s.style.display='block'; s.scrollTop=0;
  document.getElementById('shade').style.display='block'; prev();
}
function closeSheet(){ document.getElementById('sheet').style.display='none'; document.getElementById('shade').style.display='none'; S.edit=null; }
function readForm(){
  var v=S.edit.v.slice(); while(v.length<11) v.push('');
  FIELDS[S.edit.kind].concat(STAFF[S.edit.kind]).forEach(function(x){ var el=document.getElementById('f'+x[0]); if(el) v[x[0]]=el.value; });
  return v;
}
function prev(){ var p=document.getElementById('pv'); if(p&&S.edit) p.innerHTML=lineHtml(S.edit.kind,readForm()); }

function openEdit(si,ii){
  var sec=S.data.sections[si], it=sec.items[ii];
  S.edit={kind:sec.kind, key:sec.key, row:it.row, a:it.v[0], v:it.v.slice()};
  showSheet(sheetHtml('Edit '+(sec.key==='HH'?'happy hour':sec.label.toLowerCase())));
}
function openAdd(si){
  var sec=S.data.sections[si];
  S.edit={kind:sec.kind, key:sec.key, row:null, v:['','','','','','','','','','','']};
  showSheet(sheetHtml('Add to '+(sec.key==='HH'?'Happy Hour':sec.label)));
}
function openSwap(si,ii){
  var sec=S.data.sections[si], it=sec.items[ii], old=it.v, n=noun(sec), draft=sec.key==='DRAFT';
  var v=['','','','','','','','',old[8],'',''];
  S.edit={kind:sec.kind, key:sec.key, row:it.row, a:old[0], v:v, swap:true, old:old, noun:n, where:draft?'Tap '+(old[8]||'?'):sec.label};
  var name=esc(old[0])+(old[1]?' '+esc(q(old[1])):'')+' '+esc(old[2]);
  var h='<h3>Swap '+n+' · '+esc(S.edit.where)+'</h3>'+
    '<div class="outbox"><span class="tag out">COMING OFF</span> <span class="lbl">'+(draft?'the keg that kicked':'the '+n+' that ran out')+'</span><div class="keg">'+name+'</div></div>'+
    '<div class="inbox"><span class="tag in">GOING ON</span> <span class="lbl">prints on the menu</span>'+
    (old[9]?'<div class="note" style="margin:8px 0">Backup listed: <b>'+esc(old[9])+'</b>'+pill(old[10])+'</div>':'')+
    '<button type="button" class="btn small ghost" style="width:100%;margin:2px 0 6px" onclick="copyOld()">Same '+n+' again? Copy it in</button>'+
    '<div class="preview" id="pv"></div>'+
    FIELDS[sec.kind].map(function(x){return fieldHtml(x[0],x[1],'');}).join('')+'</div>'+
    '<div class="inbox" style="background:#FBF3E4;border-color:#EAD9B8"><span class="tag next">NEXT UP</span> <span class="lbl">the new backup (staff only)</span>'+
    fieldHtml(9,'Backup '+n,'',true)+fieldHtml(10,'Where the backup is','',true)+'</div>'+
    '<div class="row"><button class="btn" onclick="save()">Swap '+n+'</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>'+
    '<p class="muted" style="text-align:center;margin-top:10px">Nothing changes until you tap Swap '+n+'.</p>';
  showSheet(h);
}
function copyOld(){
  var o=S.edit.old; FIELDS[S.edit.kind].forEach(function(x){ var el=document.getElementById('f'+x[0]); if(el) el.value=o[x[0]]||''; }); prev();
}
function undoKeg(logRow){
  call('undoChange',[logRow],function(d){ S.data=d; render(); loadSwaps(); toast('Undone. It\'s back the way it was.'); },'Undoing…');
}
function save(){
  var v=readForm(), e=S.edit;
  if(!v[0].trim()){ toast(S.edit.swap?'Fill in what\'s going on.':'The first field can\'t be empty.'); return; }
  if(e.swap){
    var outN=e.old[0]+(e.old[1]?' '+q(e.old[1]):''), inN=v[0]+(v[1]?' '+q(v[1]):'');
    if(!confirm(e.where+':\n\nComing off: '+outN+'\nGoing on: '+inN+'\n\nSwap?')) return;
    call('swapKeg',[S.week,e.row,v,e.a],function(d){
      S.data=d; closeSheet(); render(); loadSwaps();
      toast('Swapped on '+e.where+'.','Undo',function(){ if(S.swaps&&S.swaps[0]) undoKeg(S.swaps[0].logRow); },8000);
    },'Swapping…');
    return;
  }
  var nm=function(x){ var t=function(y){return String(y||'').trim();};
    var n=[t(x[0]),t(x[1])?q(t(x[1])):'',t(x[2])].filter(Boolean).join(' '), tail=[t(x[4]),t(x[5]),t(x[6])].filter(Boolean).join(' | ');
    return n+(tail?' | '+tail:'')+(t(x[7])?' *'+t(x[7]):'')+(t(x[9])?'  (next up: '+t(x[9])+(t(x[10])?', '+t(x[10]):'')+')':''); };
  if(e.row){
    var changed=false; for(var i=0;i<11;i++) if(String(e.v[i]||'').trim()!==String(v[i]||'').trim()) changed=true;
    if(!changed){ closeSheet(); return; }
    if(!confirm('Save this change?\n\nWas: '+nm(e.v)+'\nNow: '+nm(v))) return;
    call('saveItem',[S.week,e.row,v,e.a],doneUndo('Saved.'));
  } else {
    if(!confirm('Add '+nm(v)+' to '+(e.key==='HH'?'Happy Hour':S.data.sections.filter(function(x){return x.key===e.key;})[0].label)+'?')) return;
    call('addItem',[S.week,e.key,v],doneUndo('Added.'));
  }
}
function del(){
  if(!confirm('Delete '+[S.edit.v[0],S.edit.v[1]?q(S.edit.v[1]):'',S.edit.v[2]].filter(Boolean).join(' ')+' from the menu?')) return;
  call('deleteItem',[S.week,S.edit.row,S.edit.a],doneUndo('Deleted.'));
}
function move(dir){ call('moveItem',[S.week,S.edit.row,dir,S.edit.a],done); }
function done(d){ S.data=d; closeSheet(); render(); toast('Saved to the sheet'); }
function doneUndo(msg){
  return function(d){
    S.data=d; closeSheet(); render();
    call('recentChanges',[S.week],function(r){ S.swaps=r; render();
      toast(msg,'Undo',function(){ if(S.swaps&&S.swaps[0]) undoKeg(S.swaps[0].logRow); },8000); },'Saving…');
  };
}

/* ---------- new week ---------- */
function openNewWeek(){
  S.edit=null;
  var s=document.getElementById('sheet');
  s.innerHTML='<h3>Start a new week</h3><p class="muted">Copies <b>'+esc(S.week)+'</b> to a new tab, then you edit what changed. The Keg Room sheet switches to the new week.</p>'+
    '<div class="field"><label>New week name</label><input id="nw" placeholder="e.g. Oct 13-19"></div>'+
    '<div class="row"><button class="btn" onclick="makeWeek()">Create</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>';
  s.style.display='block'; document.getElementById('shade').style.display='block';
}
function makeWeek(){
  var n=document.getElementById('nw').value.trim();
  if(!n){ toast('Type a name for the new week.'); return; }
  call('newWeek',[S.week,n],function(w){ S.weeks=w.weeks; fillWeeks(n); closeSheet(); loadWeek(n); toast('New week created'); },'Copying…');
}
init();

/* Auto-update: the phone can hold on to an old copy of the app for a while.
   Check GitHub for a newer version whenever the app opens or comes back to
   the front, and reload once if there is one. */
var APP_BUILD='20261012151901';
function checkUpdate(){
  fetch('version.txt?'+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(v){
    v=v.trim(); if(v && v!==APP_BUILD && !sessionStorage.getItem('fe_reloaded_'+v)){
      try{ sessionStorage.setItem('fe_reloaded_'+v,'1'); }catch(e){}
      location.replace(location.pathname+'?v='+encodeURIComponent(v));
    }
  }).catch(function(){});
}
checkUpdate();
var hiddenAt=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ hiddenAt=Date.now(); return; }
  checkUpdate();
  /* Back after a while: reload the list so nobody edits an old copy. */
  var sheetOpen=document.getElementById('sheet').style.display==='block';
  if(hiddenAt && Date.now()-hiddenAt>60000 && S.data && !sheetOpen && document.getElementById('busy').style.display!=='flex') refreshWeek();
});
</script>
</body>
</html>
