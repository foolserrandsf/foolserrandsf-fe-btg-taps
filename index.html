<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>BTG &amp; Taps</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<meta name="apple-mobile-web-app-title" content="BTG &amp; Taps">
<meta name="theme-color" content="#1F9A96">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b2023; --brown:#17807E; --teal:#1F9A96; --cream:#eef0ee; --line:#d9dedc; --muted:#5a6469; --gold:#f1f1ec; --red:#b42318; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--cream); }
  header { position:sticky; top:0; z-index:5; background:var(--teal); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 0; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .brand img { width:44px; height:44px; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  header h1 { margin:0; font:600 19px Lora, Georgia, serif; letter-spacing:.3px; }
  header h1 small { display:block; font:400 12px "IBM Plex Sans", Arial, sans-serif; letter-spacing:1.5px; text-transform:uppercase; opacity:.85; }
  .weekbar { display:flex; gap:8px; margin-bottom:10px; }
  select, input, textarea { font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; background:#fff; }
  .weekbar select { flex:1; }
  nav { display:flex; }
  nav button { flex:1; background:none; border:0; color:#d6f0ee; font:600 15px inherit; padding:10px 0 12px; border-bottom:3px solid transparent; font-family:inherit; }
  nav button.on { color:#fff; border-color:var(--gold); }
  main { padding:12px 16px 120px; max-width:640px; margin:0 auto; }
  .sec { margin:18px 0 6px; display:flex; align-items:baseline; justify-content:space-between; }
  .sec h2 { margin:0; font:700 19px Lora, Georgia, serif; }
  .item { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:6px 0; font-family:Georgia, serif; font-size:15px; }
  .item .sub { font-size:13px; font-style:italic; color:#4a403a; }
  .item .staff { font-family:-apple-system, Arial, sans-serif; font-size:12px; color:var(--muted); margin-top:4px; }
  .add { background:none; border:1px dashed var(--muted); color:var(--muted); border-radius:12px; padding:9px; width:100%; font:inherit; margin:4px 0 0; }
  .btn { border:0; border-radius:10px; padding:11px 16px; font:600 15px inherit; font-family:inherit; background:var(--brown); color:#fff; }
  .btn.ghost { background:#fff; color:var(--brown); border:1px solid var(--line); }
  .btn.danger { background:#fff; color:var(--red); border:1px solid #e8c9c3; }
  .btn.small { padding:7px 12px; font-size:13px; font-family:-apple-system, Arial, sans-serif; }
  .tap { display:flex; gap:12px; align-items:flex-start; }
  .tapno { flex:0 0 38px; height:38px; border-radius:50%; background:var(--brown); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:Arial; }
  .tap .body { flex:1; }
  .next { font-family:-apple-system, Arial, sans-serif; font-size:13px; margin-top:4px; }
  .next b { color:var(--brown); }
  .none { color:var(--red); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  .card h3 { margin:0 0 6px; font:700 17px Lora, Georgia, serif; }
  .muted { color:var(--muted); font-size:14px; }
  a.link { display:block; padding:12px; margin-top:8px; border-radius:10px; background:var(--cream); color:var(--brown); font-weight:600; text-decoration:none; text-align:center; }
  /* editor sheet */
  .shade { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:#fff; border-radius:16px 16px 0 0; max-height:92vh; overflow:auto; padding:16px 16px 28px; display:none; }
  .sheet h3 { margin:0 0 4px; font:700 18px Lora, Georgia, serif; }
  .field { margin:10px 0; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .field.staff input { background:#F0F0F0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 10px; }
  .preview { background:var(--cream); border-radius:10px; padding:10px; font-family:Georgia, serif; text-align:center; margin:8px 0; font-size:14px; }
  .outbox { background:#FBE9E7; border:1px solid #F1C7C0; border-radius:12px; padding:10px 12px; margin:10px 0; }
  .inbox { background:#E3F3F1; border:1px solid #BFE3DF; border-radius:12px; padding:10px 12px 4px; margin:10px 0; }
  .tag { display:inline-block; font:700 11px "IBM Plex Sans", Arial, sans-serif; letter-spacing:1px; padding:2px 7px; border-radius:6px; color:#fff; margin-bottom:6px; }
  .tag.out { background:var(--red); } .tag.in { background:var(--brown); } .tag.next { background:#8a5300; }
  .outbox .keg { font-family:Lora, Georgia, serif; text-decoration:line-through; color:#7a2a1f; }
  .lbl { font:700 10.5px "IBM Plex Sans", Arial, sans-serif; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
  .swaps { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:8px 0 14px; }
  .swaps h4 { margin:2px 0 6px; font:600 13px "IBM Plex Sans", Arial, sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .swap { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .swap:first-of-type { border-top:0; }
  .swap .t { flex:1; }
  #toast button { background:none; border:1px solid rgba(255,255,255,.6); color:#fff; border-radius:8px; padding:5px 10px; margin-left:10px; font:600 13px inherit; }
  .preview:empty { display:none; }
  .note { background:#FFF6DA; border-radius:10px; padding:10px; font-size:14px; margin:8px 0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .row .btn { flex:1; }
  .stafflabel { margin:16px 0 0; font-size:12px; font-weight:700; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(20px + env(safe-area-inset-bottom)); z-index:30; background:var(--ink); color:#fff; padding:12px 14px; border-radius:12px; display:none; font-size:14px; align-items:center; justify-content:space-between; }
  #busy { position:fixed; inset:0; z-index:40; background:rgba(247,242,234,.7); display:none; align-items:center; justify-content:center; font-weight:600; color:var(--brown); }
</style>
</head>

  return esc(desc).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function lineHtml(kind, v){
  if (kind==='beer'){
    var tail=[v[4],v[5],price(v[6])].filter(Boolean).join(' | ');
    var h=esc(v[0])+(v[1]?' '+esc(q(v[1])):'')+' <b>'+esc(v[2])+'</b> '+(tail?'| '+esc(tail):'')+(v[7]?' *<b><i>'+esc(v[7])+'</i></b>':'');
    if (v[3]) h+='<div class="sub">'+rich(v[3])+'</div>';
    return h;
  }
  if (kind==='wine'){
    return esc(v[0])+(v[1]?' '+esc(q(v[1])):'')+' <b>'+esc(v[2])+'</b>'+(v[5]?' '+esc(v[5]):'')+
      '<div>'+esc(v[3])+(v[4]?' '+esc(v[4]):'')+' | '+esc(price(v[6]))+(v[7]?' *<b><i>'+esc(v[7])+'</i></b>':'')+'</div>';
  }
  return v[6] ? '<b>$'+esc(price(v[6]))+' '+esc(v[0])+(v[7]?' *'+esc(v[7]):'')+'</b>' : '<b>'+esc(v[0])+'</b>';
}

function toast(msg,label,fn,ms){
  var t=document.getElementById('toast'); t.innerHTML='<span>'+esc(msg)+'</span>'; t.style.display='flex';
  if(label){ var b=document.createElement('button'); b.textContent=label; b.onclick=function(){ t.style.display='none'; fn(); }; t.appendChild(b); }
  clearTimeout(toast.h); toast.h=setTimeout(function(){t.style.display='none';},ms||3500);
}
function busy(on,txt){ document.getElementById('busytext').textContent=txt||'Saving…'; document.getElementById('busy').style.display=on?'flex':'none'; }
function getPin(){ try{ return localStorage.getItem('fe_pin')||''; }catch(e){ return S.pin||''; } }
function setPin(p){ S.pin=p; try{ localStorage.setItem('fe_pin',p); }catch(e){} }
function call(fn,args,ok,txt){
  if(!getPin()){ askPin(function(){ call(fn,args,ok,txt); }); return; }
  busy(true,txt);
  fetch(window.FE_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({pin:getPin(),fn:fn,args:args})})
  .then(function(r){ return r.json(); })
  .then(function(res){
    busy(false);
    if(res.ok){ ok(res.result); return; }
    if(res.badPin){ setPin(''); askPin(function(){ call(fn,args,ok,txt); },'That PIN didn\'t work. Try again.'); return; }
    toast(res.error||'Something went wrong.');
  })
  .catch(function(){ busy(false); toast('Can\'t reach the sheet. Check the connection and try again.'); });
}
function askPin(then,msg){
  var s=document.getElementById('sheet');
  s.innerHTML='<h3>Enter the staff PIN</h3><p class="muted">'+(msg?esc(msg):'You only need to do this once on this phone.')+'</p>'+
    '<div class="field"><input id="pinbox" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="PIN"></div>'+
    '<div class="row"><button class="btn" id="pinok">Unlock</button></div>';
  s.style.display='block'; document.getElementById('shade').style.display='block';
  var go=function(){ var v=document.getElementById('pinbox').value.trim(); if(!v) return; setPin(v); s.style.display='none'; document.getElementById('shade').style.display='none'; then(); };
  document.getElementById('pinok').onclick=go;
  document.getElementById('pinbox').onkeydown=function(e){ if(e.key==='Enter') go(); };
  setTimeout(function(){ document.getElementById('pinbox').focus(); },50);
}
function init(){
  call('listWeeks',[],function(w){
    S.weeks=w.weeks; fillWeeks(w.current); loadWeek(w.current);
  },'Loading…');
}
function fillWeeks(sel){
  document.getElementById('week').innerHTML=S.weeks.map(function(n){return '<option'+(n===sel?' selected':'')+'>'+esc(n)+'</option>';}).join('');
}
function loadWeek(name){
  S.week=name;
  call('getWeek',[name],function(d){ S.data=d; render(); },'Loading…');
}
function tab(t){
  S.tab=t; ['menu','taps','print'].forEach(function(x){document.getElementById('t-'+x).className= x===t?'on':'';});
  render(); if(t==='taps') loadSwaps();
}
function render(){
  var m=document.getElementById('main');
  if(!S.data){ m.innerHTML='<p class="muted">Loading…</p>'; return; }
  if(S.tab==='menu') m.innerHTML=renderMenu();
  if(S.tab==='taps') m.innerHTML=renderTaps();
  if(S.tab==='print') m.innerHTML=renderPrint();
}
function renderMenu(){
  return S.data.sections.map(function(sec,si){
    var h='<div class="sec"><h2>'+esc(sec.key==='HH'?'Happy Hour':sec.label)+'</h2></div>';
    sec.items.forEach(function(it,ii){
      var staff='';
      if(sec.kind==='beer' && (it.v[8]||it.v[9])) staff='<div class="staff">'+(it.v[8]?'Tap '+esc(it.v[8]):'')+(it.v[9]?' · Next up: '+esc(it.v[9]):'')+'</div>';
      if(sec.kind==='wine' && it.v[9]) staff='<div class="staff">Next up: '+esc(it.v[9])+'</div>';
      h+='<div class="item" onclick="openEdit('+si+','+ii+')">'+lineHtml(sec.kind,it.v)+staff+'</div>';
    });
    h+='<button class="add" onclick="openAdd('+si+')">+ Add to '+esc(sec.key==='HH'?'Happy Hour':sec.label)+'</button>';
    return h;
  }).join('');
}
function renderTaps(){
  var draft=S.data.sections.filter(function(s){return s.key==='DRAFT';})[0];
  if(!draft) return '<p class="muted">No DRAFT section on this tab.</p>';
  var si=S.data.sections.indexOf(draft);
  var items=draft.items.map(function(it,ii){return {it:it,ii:ii};})
    .sort(function(a,b){return (parseFloat(a.it.v[8])||99)-(parseFloat(b.it.v[8])||99);});
  var h='<p class="muted">Keg kicked? Tap <b>Swap keg</b> on that tap. The kicked keg comes <b>OUT</b>, the new one goes <b>IN</b>, and the menu updates. Made a mistake? Hit <b>Undo</b> under Recent swaps.</p>';
  if(S.swaps && S.swaps.length){
    h+='<div class="swaps"><h4>Recent swaps</h4>'+S.swaps.map(function(w){
      return '<div class="swap"><div class="t"><b>Tap '+esc(w.tap)+'</b> · '+esc(w.when)+'<br><span style="color:var(--red)">OUT</span> '+esc(w.out)+
        '<br><span style="color:var(--brown)">IN</span> '+esc(w.inn)+'</div><button class="btn small ghost" onclick="undoKeg('+w.logRow+')">Undo</button></div>';
    }).join('')+'</div>';
  }
  return h+items.map(function(x){
      var v=x.it.v;
      return '<div class="item"><div class="tap"><div class="tapno">'+esc(v[8]||'?')+'</div><div class="body" onclick="openEdit('+si+','+x.ii+')">'+
        '<div class="lbl">On tap now</div>'+esc(v[0])+(v[1]?' '+esc(q(v[1])):'')+' <b>'+esc(v[2])+'</b>'+
        '<div class="next"><span class="lbl">Next up</span> '+(v[9]?'<b>'+esc(v[9])+'</b>'+(v[10]?' · '+esc(v[10]):''):'<span class="none">none listed</span>')+'</div></div>'+
        '<button class="btn small ghost" onclick="openSwap('+si+','+x.ii+')">Swap keg</button></div></div>';
    }).join('');
}
function loadSwaps(){
  call('recentSwaps',[S.week],function(r){ S.swaps=r; if(S.tab==='taps') render(); },'Loading…');
}
function renderPrint(){
  return '<div class="card"><h3>Make this week\'s menu</h3><p class="muted">Builds the printable PDF and the editable Google Doc from <b>'+esc(S.week)+
    '</b> and saves both in the Menus folder in Drive. Takes about 20–40 seconds.</p><button class="btn" style="width:100%" onclick="makeMenu()">Make Menu</button><div id="menuLinks"></div></div>'+
    '<div class="card"><h3>Printing</h3><p class="muted">Landscape, actual size (100%), 8.5 × 11. Print, flip the sheet printed side up, print the same page again, then cut in half.</p></div>';
}
function makeMenu(){
  call('makeMenuFor',[S.week],function(r){
    var h='<a class="link" href="'+r.pdfUrl+'" target="_blank">Open the PDF to print</a><a class="link" href="'+r.docUrl+'" target="_blank">Open the editable Google Doc</a>';
    if(r.pages>1) h='<div class="note">Too long for one page. Shorten a description or remove an item, then make it again.</div>'+h;
    document.getElementById('menuLinks').innerHTML=h;
  },'Making the menu… (up to a minute)');
}

/* ---------- editor ---------- */
function fieldHtml(i,label,val,staff){
  var big = i===3 && S.edit.kind==='beer';
  return '<div class="field'+(staff?' staff':'')+'"><label>'+esc(label)+'</label>'+
    (big?'<textarea id="f'+i+'" rows="2" oninput="prev()">'+esc(val)+'</textarea>':'<input id="f'+i+'" value="'+esc(val)+'" oninput="prev()">')+'</div>';
}
function sheetHtml(title,note){
  var e=S.edit, v=e.v, f=FIELDS[e.kind], st=STAFF[e.kind];
  var h='<h3>'+esc(title)+'</h3>'+(note?'<div class="note">'+note+'</div>':'')+'<div class="preview" id="pv"></div>';
  h+=f.map(function(x){return fieldHtml(x[0],x[1],v[x[0]]||'');}).join('');
  if(st.length){ h+='<div class="stafflabel">Staff only – never prints</div>'+st.map(function(x){return fieldHtml(x[0],x[1],v[x[0]]||'',true);}).join(''); }
  h+='<div class="row"><button class="btn" onclick="save()">Save</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>';
  if(e.row){
    h+='<div class="row"><button class="btn small ghost" onclick="move(-1)">↑ Move up</button><button class="btn small ghost" onclick="move(1)">↓ Move down</button>'+
       '<button class="btn small danger" onclick="del()">Delete</button></div>';
  }
  return h;
}
function showSheet(html){
  var s=document.getElementById('sheet'); s.innerHTML=html; s.style.display='block'; s.scrollTop=0;
  document.getElementById('shade').style.display='block'; prev();
}
function closeSheet(){ document.getElementById('sheet').style.display='none'; document.getElementById('shade').style.display='none'; S.edit=null; }
function readForm(){
  var v=S.edit.v.slice(); while(v.length<11) v.push('');
  FIELDS[S.edit.kind].concat(STAFF[S.edit.kind]).forEach(function(x){ var el=document.getElementById('f'+x[0]); if(el) v[x[0]]=el.value; });
  return v;
}
function prev(){ var p=document.getElementById('pv'); if(p&&S.edit) p.innerHTML=lineHtml(S.edit.kind,readForm()); }

function openEdit(si,ii){
  var sec=S.data.sections[si], it=sec.items[ii];
  S.edit={kind:sec.kind, key:sec.key, row:it.row, a:it.v[0], v:it.v.slice()};
  showSheet(sheetHtml('Edit '+(sec.key==='HH'?'happy hour':sec.label.toLowerCase())));
}
function openAdd(si){
  var sec=S.data.sections[si];
  S.edit={kind:sec.kind, key:sec.key, row:null, v:['','','','','','','','','','','']};
  showSheet(sheetHtml('Add to '+(sec.key==='HH'?'Happy Hour':sec.label)));
}
function openSwap(si,ii){
  var sec=S.data.sections[si], it=sec.items[ii], old=it.v;
  var v=['','','','','','','','',old[8],'',''];
  S.edit={kind:'beer', key:sec.key, row:it.row, a:old[0], v:v, swap:true, old:old};
  var h='<h3>Swap keg · Tap '+esc(old[8]||'?')+'</h3>'+
    '<div class="outbox"><span class="tag out">OUT</span> <span class="lbl">the keg that kicked</span><div class="keg">'+esc(old[0])+(old[1]?' '+esc(q(old[1])):'')+' '+esc(old[2])+'</div></div>'+
    '<div class="inbox"><span class="tag in">IN</span> <span class="lbl">the keg going on now (prints on the menu)</span>'+
    (old[9]?'<div class="note" style="margin:8px 0">Backup listed for this tap: <b>'+esc(old[9])+'</b>'+(old[10]?' ('+esc(old[10])+')':'')+'</div>':'')+
    '<div class="preview" id="pv"></div>'+
    FIELDS.beer.map(function(x){return fieldHtml(x[0],x[1],'');}).join('')+'</div>'+
    '<div class="inbox" style="background:#FBF3E4;border-color:#EAD9B8"><span class="tag next">NEXT UP</span> <span class="lbl">the new backup for this tap (staff only)</span>'+
    fieldHtml(9,'Backup keg','',true)+fieldHtml(10,'Where it is','',true)+'</div>'+
    '<div class="row"><button class="btn" onclick="save()">Swap keg</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>'+
    '<p class="muted" style="text-align:center;margin-top:10px">Nothing changes until you tap Swap keg.</p>';
  showSheet(h);
}
function undoKeg(logRow){
  call('undoSwap',[logRow],function(d){ S.data=d; render(); loadSwaps(); toast('Undone. The old keg is back on the menu.'); },'Undoing…');
}
function save(){
  var v=readForm(), e=S.edit;
  if(!v[0].trim()){ toast(S.edit.swap?'Fill in the brewery of the keg going IN.':'The first field can\'t be empty.'); return; }
  if(e.swap){
    var outN=e.old[0]+(e.old[1]?' '+q(e.old[1]):''), inN=v[0]+(v[1]?' '+q(v[1]):'');
    if(!confirm('Tap '+(e.old[8]||'?')+':\n\nOUT: '+outN+'\nIN: '+inN+'\n\nSwap these kegs?')) return;
    call('swapKeg',[S.week,e.row,v,e.a],function(d){
      S.data=d; closeSheet(); render(); loadSwaps();
      toast('Swapped on tap '+(e.old[8]||'?')+'.','Undo',function(){ if(S.swaps&&S.swaps[0]) undoKeg(S.swaps[0].logRow); },8000);
    },'Swapping…');
    return;
  }
  if(e.row) call('saveItem',[S.week,e.row,v,e.a],done);
  else call('addItem',[S.week,e.key,v],done);
}
function del(){
  if(!confirm('Delete this item from '+S.week+'?')) return;
  call('deleteItem',[S.week,S.edit.row,S.edit.a],done);
}
function move(dir){ call('moveItem',[S.week,S.edit.row,dir,S.edit.a],done); }
function done(d){ S.data=d; closeSheet(); render(); toast('Saved to the sheet'); }

/* ---------- new week ---------- */
function openNewWeek(){
  S.edit=null;
  var s=document.getElementById('sheet');
  s.innerHTML='<h3>Start a new week</h3><p class="muted">Copies <b>'+esc(S.week)+'</b> to a new tab, then you edit what changed. The Keg Room sheet switches to the new week.</p>'+
    '<div class="field"><label>New week name</label><input id="nw" placeholder="e.g. Oct 13-19"></div>'+
    '<div class="row"><button class="btn" onclick="makeWeek()">Create</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>';
  s.style.display='block'; document.getElementById('shade').style.display='block';
}
function makeWeek(){
  var n=document.getElementById('nw').value.trim();
  if(!n){ toast('Type a name for the new week.'); return; }
  call('newWeek',[S.week,n],function(w){ S.weeks=w.weeks; fillWeeks(n); closeSheet(); loadWeek(n); toast('New week created'); },'Copying…');
}
init();
</script>
</body>
</html>
